name: refresh-lockfile

on:
  push:
    branches: [cursor/bump-next-16-4-1-a214]
    paths:
      - package.json
      - .github/workflows/refresh-lockfile.yml

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cursor/bump-next-16-4-1-a214
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only --frozen-lockfile=false
      - name: Commit lockfile if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "lockfile already current"
            exit 0
          fi
          git commit -m "chore(deps): refresh lockfile for next 16.4.1"
          git push
